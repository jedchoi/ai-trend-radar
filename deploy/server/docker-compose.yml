# backend 서버 배포 (infrastructure-design.md). 사용: cp .env.example .env → 값 채우기 → docker compose up -d --build
services:
  api:
    build: ../../server
    image: ai-trend-radar-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/radar.db
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - radar-data:/data
    networks: [internal]
    # 포트를 외부에 열지 않는다 (proxy 만 접근)

  proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on: [api]
    environment:
      RADAR_DOMAIN: ${RADAR_DOMAIN:?RADAR_DOMAIN 을 .env 에 넣으세요}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

volumes:
  radar-data:
  caddy-data:
  caddy-config:

networks:
  internal:

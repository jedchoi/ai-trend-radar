# backend 서버 배포 (infrastructure-design.md). 사용: cp .env.example .env → 값 채우기 → docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_DB: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣으세요}
    volumes:
      - radar-pg:/var/lib/postgresql/data
    networks: [internal]
    # 포트를 열지 않는다 (api 만 접근)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: ../../server
    image: ai-trend-radar-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://radar:${POSTGRES_PASSWORD}@db:5432/radar
    read_only: true
    tmpfs:
      - /tmp
    networks: [internal]
    # 포트를 외부에 열지 않는다 (proxy 만 접근)

  proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on: [api]
    environment:
      RADAR_DOMAIN: ${RADAR_DOMAIN:?RADAR_DOMAIN 을 .env 에 넣으세요}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

volumes:
  radar-pg:
  caddy-data:
  caddy-config:

networks:
  internal:

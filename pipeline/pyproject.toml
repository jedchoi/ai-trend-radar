[project]
name = "ai-trend-radar-pipeline"
version = "1.0.0"
description = "Hugging Face 논문 · Hub 트렌드를 수집 · 분석해 AI Trend Radar 서버에 올리는 PC 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.3",
]

[project.scripts]
radar = "radar.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.15",
    "ruff==0.17.5",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["radar"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"tools/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not perf'"
markers = ["perf: performance test (NFR-S01), run with -m perf"]

[tool.coverage.run]
source = ["app"]
branch = true
